---
# defaults file for s3cmd-role
# SECURITY WARNING: Never store actual credentials in this file.
# Use Ansible Vault or environment variables for sensitive data.
s3cmd_version: ""
s3cmd_authorized_group: s3cmd
s3cmd_authorized_user: ""
# These must be provided securely (e.g., via Ansible Vault)
s3cmd_access_key: ""
s3cmd_access_token: ""
s3cmd_add_encoding_exts:
s3cmd_add_headers:
s3cmd_cache_file:
s3cmd_expiry_date:
s3cmd_expiry_days:
s3cmd_expiry_prefix:
s3cmd_bucket_location: US
s3cmd_cloudfront_host: cloudfront.amazonaws.com
s3cmd_default_mime_type: binary/octet-stream
s3cmd_delay_updates: False
s3cmd_delete_after: False
s3cmd_delete_after_fetch: False
s3cmd_delete_removed: False
s3cmd_dry_run: False
s3cmd_enable_multipart: True
s3cmd_encoding: UTF-8
s3cmd_encrypt: False
s3cmd_follow_symlinks: False
s3cmd_force: False
s3cmd_get_continue: False
s3cmd_gpg_command: /usr/bin/gpg
s3cmd_gpg_decrypt: "%(gpg_command)s -d --verbose --no-use-agent --batch --yes --passphrase-fd %(passphrase_fd)s -o %(output_file)s %(input_file)s"
s3cmd_gpg_encrypt: "%(gpg_command)s -c --verbose --no-use-agent --batch --yes --passphrase-fd %(passphrase_fd)s -o %(output_file)s %(input_file)s"
# SECURITY WARNING: GPG passphrase should be stored securely
s3cmd_gpg_passphrase: ""
s3cmd_guess_mime_type: True
s3cmd_host_base: s3.amazonaws.com
s3cmd_host_bucket: "%(bucket)s.s3.amazonaws.com"
s3cmd_human_readable_sizes: False
s3cmd_ignore_failed_copy: False
s3cmd_invalidate_default_index_on_cf: False
s3cmd_invalidate_default_index_root_on_cf: True
s3cmd_invalidate_on_cf: False
s3cmd_list_md5: False
s3cmd_log_target_prefix:
s3cmd_max_delete: -1
s3cmd_mime_type:
s3cmd_multipart_chunk_size_mb: 15
s3cmd_preserve_attrs: True
s3cmd_progress_meter: True
s3cmd_proxy_host:
s3cmd_proxy_port: 0
s3cmd_put_continue: False
s3cmd_recursive: False
s3cmd_recv_chunk: 4096
s3cmd_reduced_redundancy: False
s3cmd_restore_days: 1
# This must be provided securely (e.g., via Ansible Vault)
s3cmd_secret_key: ""
s3cmd_send_chunk: 4096
s3cmd_server_side_encryption: False
s3cmd_simpledb_host: sdb.amazonaws.com
s3cmd_skip_existing: False
s3cmd_socket_timeout: 300
s3cmd_urlencoding_mode: normal
s3cmd_use_https: True
s3cmd_use_mime_magic: True
s3cmd_verbosity: WARNING
s3cmd_website_endpoint: http://%(bucket)s.s3-website-% (location)s.amazonaws.com/
s3cmd_website_error:
s3cmd_website_index: index.html
